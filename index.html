<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>全螢幕影片播放器</title><style>body{background:#0b1020}.video-box:fullscreen{background:#000;display:flex;align-items:center;justify-content:center}.video-box:fullscreen video{width:100%;height:100%;max-height:100vh;object-fit:contain}.video-box:-webkit-full-screen{background:#000;display:flex;align-items:center;justify-content:center}.video-box:-webkit-full-screen video{width:100%;height:100%;object-fit:contain}</style></head>
<body class="min-h-screen text-white flex items-center justify-center p-4"><main class="w-full max-w-4xl">
<header class="mb-6 text-center"><div class="text-4xl mb-3">🎬</div><h1 class="text-3xl sm:text-4xl font-bold tracking-tight">全螢幕影片播放器</h1><p class="text-slate-400 mt-2">匯入影片，按一下即可開始播放並放大至全螢幕</p></header>
<section class="rounded-2xl border border-slate-700 bg-slate-900/80 p-4 sm:p-6 shadow-2xl">
<div id="drop" class="video-box aspect-video rounded-xl bg-black border border-slate-700 overflow-hidden flex items-center justify-center relative"><video id="player" class="hidden w-full h-full object-contain" controls playsinline></video><div id="empty" class="text-center p-6"><div class="text-5xl mb-3">▶</div><p class="font-semibold">尚未選擇影片</p><p class="text-sm text-slate-400 mt-1">支援瀏覽器可播放的影片格式，例如 MP4、WebM</p></div></div>
<div class="mt-5 flex flex-col sm:flex-row gap-3"><label class="flex-1 cursor-pointer rounded-xl bg-indigo-500 hover:bg-indigo-400 transition px-5 py-3 text-center font-semibold">選擇影片<input id="file" type="file" accept="video/*" class="hidden"></label><button id="playFull" disabled class="flex-1 rounded-xl bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-700 disabled:text-slate-400 disabled:cursor-not-allowed transition px-5 py-3 font-semibold">▶ 播放並進入全螢幕</button></div>
<div class="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm"><label class="inline-flex items-center gap-2 text-slate-300"><input id="mute" type="checkbox" checked class="accent-indigo-500"> 靜音開始播放（有助自動播放）</label><label class="inline-flex items-center gap-2 text-slate-300"><input id="loop" type="checkbox" class="accent-indigo-500"> 循環播放</label></div>
<p id="name" class="mt-4 text-sm text-slate-400 truncate" aria-live="polite">影片只會在此瀏覽器播放，不會上傳。</p><p id="msg" class="mt-2 min-h-5 text-sm text-amber-300" aria-live="polite">提示：瀏覽器會要求你按下播放按鈕，才能安全地進入全螢幕。</p>
</section><p class="text-center text-xs text-slate-500 mt-4">全螢幕與自動播放權限由瀏覽器控制；部分手機瀏覽器可能使用自己的全螢幕播放器。</p></main>
<script>
const file=document.getElementById('file'),video=document.getElementById('player'),empty=document.getElementById('empty'),playFull=document.getElementById('playFull'),name=document.getElementById('name'),msg=document.getElementById('msg'),mute=document.getElementById('mute'),loop=document.getElementById('loop'),box=document.getElementById('drop');let currentUrl='';
file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(f);video.src=currentUrl;video.classList.remove('hidden');empty.classList.add('hidden');name.textContent='已載入：'+f.name;playFull.disabled=false;msg.textContent='影片已準備好。按「播放並進入全螢幕」開始。'});
mute.addEventListener('change',()=>video.muted=mute.checked);loop.addEventListener('change',()=>video.loop=loop.checked);
playFull.addEventListener('click',async()=>{if(!video.src)return;video.muted=mute.checked;video.loop=loop.checked;msg.textContent='';try{const fs=box.requestFullscreen||box.webkitRequestFullscreen;if(fs){const result=fs.call(box);if(result&&result.catch)await result.catch(()=>{});}else if(video.webkitEnterFullscreen){video.webkitEnterFullscreen();}await video.play();msg.textContent='正在播放。按 Esc 或使用播放器控制項離開全螢幕。';}catch(e){msg.textContent='無法自動播放或全螢幕。請在影片播放器中按播放，或確認瀏覽器允許全螢幕。';}});
video.addEventListener('error',()=>{if(video.src)msg.textContent='影片格式可能不受此瀏覽器支援，請試試 MP4 或 WebM。'});
box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('border-indigo-400')});box.addEventListener('dragleave',()=>box.classList.remove('border-indigo-400'));box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('border-indigo-400');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f&&f.type.startsWith('video/')){const dt=new DataTransfer();dt.items.add(f);file.files=dt.files;file.dispatchEvent(new Event('change'));}});
window.addEventListener('beforeunload',()=>{if(currentUrl)URL.revokeObjectURL(currentUrl)});
</script></body></html>
